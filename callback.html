<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Signing in… — Ask Every Model</title>
<style>
  body { font:16px/1.6 system-ui,sans-serif; max-width:520px; margin:80px auto; padding:0 20px; color:#14161a; }
  code { background:#f2f2f2; padding:1px 5px; border-radius:4px; }
  a { color:#0b6bcb; }
</style>
</head>
<body>
<h1>Signing in…</h1>
<p id="msg">Exchanging the authorization code for your own scoped key.</p>
<p><a href="index.html">Back to the app</a></p>

<script>
const TOKEN_KEY = "aem_token";
const params = new URLSearchParams(location.search);
const message = document.getElementById("msg");

function fail(text) {
  message.innerHTML = text;
}

(async function exchange() {
  const code = params.get("code");
  const state = params.get("state");
  const error = params.get("error");
  if (error) return fail(`Authorization was refused (<code>${error}</code>). <a href="index.html">Try again</a>`);
  if (!code) return fail("No authorization code in the callback URL.");

  const expectedState = sessionStorage.getItem("aem_state");
  const verifier = sessionStorage.getItem("aem_verifier");
  if (!verifier) return fail("Missing PKCE verifier — start the sign-in again from the app.");
  if (expectedState && state !== expectedState) return fail("State mismatch — refusing to continue.");

  const body = new URLSearchParams({
    grant_type: "authorization_code",
    code,
    client_id: "pk_ACX1OYINVREl22hK",
    redirect_uri: new URL("callback.html", location.href).toString(),
    code_verifier: verifier,
  });

  try {
    const res = await fetch("https://enter.pollinations.ai/api/oauth/token", { method: "POST", body });
    if (!res.ok) {
      const detail = await res.text();
      return fail(`Token exchange failed (HTTP ${res.status}). <code>${detail.slice(0, 200)}</code>`);
    }
    const data = await res.json();
    if (!data.access_token) return fail("The token endpoint returned no access token.");
    sessionStorage.setItem(TOKEN_KEY, data.access_token);
    sessionStorage.removeItem("aem_verifier");
    sessionStorage.removeItem("aem_state");
    location.replace("index.html");
  } catch (e) {
    fail(`Token exchange failed: <code>${e.message}</code>`);
  }
})();
</script>
</body>
</html>
